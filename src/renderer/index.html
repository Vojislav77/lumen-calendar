<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>Lumen Calendar</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-accent="coral">

  <!-- ══ Ribbon / titlebar ══ -->
  <header id="ribbon">
    <div class="ribbon-left">
      <img id="appIcon" src="../../assets/icon.png" alt="" draggable="false">
      <span class="app-name">Lumen&nbsp;Calendar</span>
    </div>
    <div class="ribbon-center" id="userArea" title="Click to edit your profile">
      <span id="userChip" class="chip">👤 <b id="userName">Your name</b></span>
      <span class="ribbon-dot">•</span>
      <span id="cityChip" class="chip">📍 <b id="userCity">Your city</b></span>
    </div>
    <div class="ribbon-right">
      <div id="clock">
        <span id="clockDate">—</span>
        <span class="clock-sep"></span>
        <span id="clockTime">—</span>
      </div>
      <div class="win-controls">
        <button id="winMin" title="Minimize"><svg width="11" height="11" viewBox="0 0 11 11"><line x1="1" y1="5.5" x2="10" y2="5.5" stroke="currentColor" stroke-width="1.4"/></svg></button>
        <button id="winMax" title="Maximize"><svg width="11" height="11" viewBox="0 0 11 11"><rect x="1.5" y="1.5" width="8" height="8" fill="none" stroke="currentColor" stroke-width="1.3" rx="1.5"/></svg></button>
        <button id="winClose" class="close" title="Close to tray"><svg width="11" height="11" viewBox="0 0 11 11"><path d="M1.5 1.5 L9.5 9.5 M9.5 1.5 L1.5 9.5" stroke="currentColor" stroke-width="1.4"/></svg></button>
      </div>
    </div>
  </header>

  <!-- ══ Toolbar ══ -->
  <nav id="toolbar">
    <div class="tb-group">
      <button class="tb-btn nav" id="navPrev" title="Previous">‹</button>
      <button class="tb-btn nav" id="navNext" title="Next">›</button>
      <button class="tb-btn pill" id="navToday">Today</button>
    </div>
    <h1 id="viewTitle">—</h1>
    <div class="spacer"></div>
    <div id="searchWrap">
      <input id="search" type="text" placeholder="Search events…" autocomplete="off">
      <div id="searchResults" class="hidden"></div>
    </div>
    <div id="viewSwitch">
      <button data-view="month" class="active">Month</button>
      <button data-view="week">Week</button>
      <button data-view="day">Day</button>
    </div>
    <div class="tb-group">
      <button class="tb-btn accent" id="btnNewEvent">＋ Event</button>
      <button class="tb-btn soft teal" id="btnNewTask">＋ Task</button>
      <button class="tb-btn soft violet" id="btnNewNote">＋ Note</button>
    </div>
    <div class="tb-group">
      <button class="tb-btn ghost" id="btnImport" title="Import .ics or .csv">⤓ Import</button>
      <button class="tb-btn ghost" id="btnImportUrl" title="Import from .ics URL">⤓ URL</button>
      <button class="tb-btn ghost" id="btnExport" title="Export to .ics">⤒ Export</button>
      <button class="tb-btn ghost icononly" id="btnSettings" title="Settings">⚙</button>
    </div>
  </nav>

  <!-- ══ Body ══ -->
  <div id="body">
    <aside id="sidebar">
      <div id="miniCal"></div>
      <section class="side-section">
        <h3>Calendars</h3>
        <ul id="calList" class="side-list"></ul>
        <button class="link-btn" id="addCalBtn">＋ New calendar</button>
      </section>
      <section class="side-section grow">
        <h3>Upcoming tasks</h3>
        <ul id="taskList" class="side-list tasks"></ul>
      </section>
      <footer id="sidebarFooter">© 2026 Vojislav Korać · Built with OpenCode</footer>
    </aside>
    <main id="viewContainer">
      <div id="monthView" class="view"></div>
      <div id="weekView" class="view hidden"></div>
      <div id="dayView" class="view hidden"></div>
    </main>
  </div>

  <div id="popover" class="hidden"></div>

  <div id="modalOverlay" class="hidden">
    <div id="modal" role="dialog"></div>
  </div>

  <div id="toasts"></div>

  <!-- ══ Modal templates ══ -->
  <template id="tpl-event">
    <h2 id="evTitle_h"></h2>
    <div class="f-row"><label>Title</label><input type="text" id="evTitle" placeholder="e.g. Coffee with Ana" autofocus></div>
    <div class="f-grid">
      <div class="f-row"><label>Calendar</label><select id="evCal"></select></div>
      <div class="f-row"><label>Category</label><select id="evCat"></select></div>
    </div>
    <div class="f-row"><label>Color</label><div class="color-picker" id="evColors"></div></div>
    <div class="f-row"><label class="f-check"><input type="checkbox" id="evAllDay"> All-day event</label></div>
    <div class="f-grid">
      <div class="f-row"><label>Starts</label><div class="dt-wrap"><input type="date" id="evStartD" class="dt-raw"><span class="dt-val" id="evStartD_val">Select date</span></div></div>
      <div class="f-row trow"><label>Time</label><input type="time" id="evStartT"></div>
    </div>
    <div class="f-grid">
      <div class="f-row"><label>Ends</label><div class="dt-wrap"><input type="date" id="evEndD" class="dt-raw"><span class="dt-val" id="evEndD_val">Select date</span></div></div>
      <div class="f-row trow"><label>Time</label><input type="time" id="evEndT"></div>
    </div>
    <div class="f-grid">
      <div class="f-row"><label>Repeats</label><select id="evRrule">
        <option value="">Does not repeat</option>
        <option value="FREQ=DAILY">Daily</option>
        <option value="FREQ=WEEKLY">Weekly</option>
        <option value="FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR">Every weekday</option>
        <option value="FREQ=MONTHLY">Monthly</option>
        <option value="FREQ=YEARLY">Yearly</option>
      </select></div>
      <div class="f-row"><label>Reminder</label><select id="evRem"></select></div>
    </div>
    <div class="f-row"><label>Location</label><input type="text" id="evLoc" placeholder="Optional"></div>
    <div class="f-row"><label>Description</label><textarea id="evDesc" placeholder="Optional"></textarea></div>
    <div class="m-actions">
      <button class="danger hidden" id="evDelete">Delete</button>
      <button class="neutral" id="evCancel">Cancel</button>
      <button class="primary" id="evSave">Add event</button>
    </div>
  </template>

  <template id="tpl-task">
    <h2 id="tkTitle_h"></h2>
    <div class="f-row"><label>Title</label><input type="text" id="tkTitle" placeholder="e.g. Water the plants" autofocus></div>
    <div class="f-grid">
      <div class="f-row"><label>Due date</label><div class="dt-wrap"><input type="date" id="tkDue" class="dt-raw"><span class="dt-val" id="tkDue_val">Select date</span></div></div>
      <div class="f-row"><label>Priority</label><select id="tkPrio">
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
      </select></div>
    </div>
    <div class="f-row"><label>Notes</label><textarea id="tkNotes" placeholder="Optional details"></textarea></div>
    <div class="f-row hidden" id="tkDoneRow"><label class="f-check"><input type="checkbox" id="tkDone"> Mark as done</label></div>
    <div class="m-actions">
      <button class="danger hidden" id="tkDelete">Delete</button>
      <button class="neutral" id="tkCancel">Cancel</button>
      <button class="primary" id="tkSave">Add task</button>
    </div>
  </template>

  <template id="tpl-note">
    <h2 id="ntTitle_h"></h2>
    <div class="f-row"><label>Title</label><input type="text" id="ntTitle" placeholder="e.g. Gift ideas" autofocus></div>
    <div class="f-grid">
      <div class="f-row"><label>Date</label><div class="dt-wrap"><input type="date" id="ntDate" class="dt-raw"><span class="dt-val" id="ntDate_val">Select date</span></div></div>
      <div class="f-row"><label>Color</label><div class="color-picker" id="ntColors"></div></div>
    </div>
    <div class="f-row"><label>Text</label><textarea id="ntText" rows="4" placeholder="Write something nice..."></textarea></div>
    <div class="m-actions">
      <button class="danger hidden" id="ntDelete">Delete</button>
      <button class="neutral" id="ntCancel">Cancel</button>
      <button class="primary" id="ntSave">Add note</button>
    </div>
  </template>

  <template id="tpl-calendar">
    <h2>New calendar</h2>
    <div class="f-row"><label>Name</label><input type="text" id="ncName" placeholder="e.g. Gym, Birthdays..." autofocus></div>
    <div class="f-row"><label>Color</label><div class="color-picker" id="ncColors"></div></div>
    <div class="m-actions">
      <button class="neutral" id="ncCancel">Cancel</button>
      <button class="primary" id="ncSave">Save</button>
    </div>
  </template>

  <template id="tpl-settings">
    <h2>Settings</h2>
    <div class="f-grid">
      <div class="f-row"><label>Your name</label><input type="text" id="stName" placeholder="Shown in the ribbon"></div>
      <div class="f-row"><label>Your city</label><input type="text" id="stCity" placeholder="Shown in the ribbon"></div>
    </div>
    <div class="f-row"><label>Accent color</label><div class="color-picker" id="stAccents"></div></div>
    <div class="f-grid">
      <div class="f-row"><label>Time format</label><div class="seg" id="stHour">
        <button data-v="1" class="active">24-hour</button>
        <button data-v="0">12-hour</button>
      </div></div>
      <div class="f-row"><label>Week starts on</label><div class="seg" id="stWeek">
        <button data-v="1" class="active">Monday</button>
        <button data-v="0">Sunday</button>
      </div></div>
    </div>
    <div class="f-row"><label>Date format</label><div class="seg" id="stDateFmt">
      <button data-v="DD/MM/YYYY" class="active">DD/MM/YYYY</button>
      <button data-v="MM/DD/YYYY">MM/DD/YYYY</button>
      <button data-v="DD Mon YYYY">DD Mon YYYY</button>
    </div></div>
    </div>
    <div class="f-row"><label class="f-check"><input type="checkbox" id="stRem"> Enable desktop reminders</label></div>
    <div class="f-row"><label class="f-check"><input type="checkbox" id="stMin"> Start minimized to tray</label></div>
    <div class="f-row"><label class="f-check"><input type="checkbox" id="stBoot"> Start with system</label></div>
    <div class="f-row"><label class="f-check"><input type="checkbox" id="stDark"> Dark mode</label></div>
    <div class="m-actions">
      <button class="neutral" id="stCancel">Cancel</button>
      <button class="primary" id="stSave">Save settings</button>
    </div>
  </template>

  <script src="app.js"></script>
</body>
</html>
